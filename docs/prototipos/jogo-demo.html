<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2630">
<title>Sítio Dae Han (demonstração)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=VT323&display=swap">
<style>
/* Identidade visual — ver docs/visual-identity.md */
:root {
  --flame: #de4a47;
  --flame-light: #f0566a;
  --ember: #e5603a;
  --wine: #8e2d52;
  --wine-dark: #6e2040;
  --brick: #b5553c;
  --leaf: #4f8a3c;
  --leaf-dark: #356b30;
  --grass: #86ad52;
  --gold: #e8c15a;
  --paper: #f8ecd2;
  --paper-dark: #ecd9b4;
  --wood: #a8703f;
  --wood-dark: #7d5029;
  --wood-deep: #5a3a22;
  --ink: #3b2630;
  --ink-soft: #6d5560;
  --bg: #2f4a2c;
  --px: 3px; /* one "pixel" of UI chrome */
  --tabs-h: 72px; /* bottom tab bar, see .tabs */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100dvh;
  color: var(--ink);
  font-family: var(--font-body), monospace;
  font-size: 22px;
  line-height: 1.15;
  /* soft leafy pixel texture */
  background-color: var(--bg);
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%),
    linear-gradient(45deg, rgba(0,0,0,.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.05) 75%);
  background-size: 12px 12px;
  background-position: 0 0, 6px 6px;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}
svg { image-rendering: pixelated; display: block; }
h1, h2, h3, .display { font-family: var(--font-display), monospace; font-weight: 500; margin: 0; letter-spacing: .02em; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }

.shell { max-width: 520px; margin: 0 auto; padding: 12px 12px calc(var(--tabs-h) + env(safe-area-inset-bottom)); }
/* farm tab: the map takes every pixel between the header and the tabs */
.shell.full { height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom)); }

/* ---- panels: parchment inside a soft wooden frame (pixel corners) ---- */
.panel {
  position: relative;
  background: var(--paper);
  padding: 14px;
  margin: 12px 0;
  box-shadow:
    0 0 0 var(--px) var(--wood),
    0 0 0 calc(var(--px) * 2) var(--wood-dark),
    inset 0 calc(var(--px) * -1) 0 var(--paper-dark),
    0 calc(var(--px) * 3) 0 calc(var(--px) * 1) rgba(0,0,0,.25);
  border-radius: 2px;
}
.panel > h2 { margin-bottom: 8px; color: var(--wine); }
.muted { color: var(--ink-soft); }
.small { font-size: 18px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }

/* ---- buttons ---- */
.btn {
  font: inherit;
  font-family: var(--font-display), monospace;
  font-size: 17px;
  color: #fff;
  background: var(--flame);
  border: 0;
  padding: 8px 14px 10px;
  cursor: pointer;
  box-shadow:
    inset 0 calc(var(--px) * -1) 0 var(--wine),
    inset 0 var(--px) 0 var(--flame-light),
    0 0 0 var(--px) var(--wine-dark);
  border-radius: 2px;
  touch-action: manipulation;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 var(--px) 0 var(--wine), 0 0 0 var(--px) var(--wine-dark); }
.btn:disabled { filter: grayscale(.8); opacity: .6; cursor: not-allowed; }
.btn.secondary { background: var(--wood); box-shadow: inset 0 calc(var(--px) * -1) 0 var(--wood-dark), inset 0 var(--px) 0 #c48b52, 0 0 0 var(--px) var(--wood-deep); }
.btn.green { background: var(--leaf); box-shadow: inset 0 calc(var(--px) * -1) 0 var(--leaf-dark), inset 0 var(--px) 0 #6fa84a, 0 0 0 var(--px) #264f27; }
.btn.small { font-size: 14px; padding: 5px 9px 7px; }
.btn.big { width: 100%; font-size: 20px; padding: 12px; }

input, select {
  font: inherit;
  color: var(--ink);
  background: #fffaf0;
  border: 0;
  padding: 8px 10px;
  width: 100%;
  box-shadow: inset 0 0 0 var(--px) var(--wood), inset 0 calc(var(--px) * 2) 0 var(--paper-dark);
  border-radius: 2px;
}
input:focus, select:focus { outline: var(--px) solid var(--flame); outline-offset: 1px; }
label { display: block; font-size: 19px; margin-bottom: 4px; color: var(--ink-soft); }

/* ---- header ---- */
.topbar { display: flex; align-items: center; gap: 10px; color: var(--paper); padding: 4px 2px; }
.topbar h1 { font-size: 22px; }
.topbar .lvl { margin-left: auto; font-family: var(--font-display); font-size: 15px; background: var(--wine); padding: 4px 8px; box-shadow: 0 0 0 var(--px) var(--wine-dark); }

/* ---- map ---- */
.map-frame { padding: 0; overflow: hidden; }
.map-frame svg { width: 100%; height: auto; }

/* ---- bottom tabs ---- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center;
  background: var(--wood-dark);
  box-shadow: 0 calc(var(--px) * -1) 0 var(--wood), 0 calc(var(--px) * -2) 0 var(--wood-deep);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; max-width: 130px;
  font-family: var(--font-display); font-size: 13px; color: var(--paper-dark);
  background: none; border: 0; padding: 8px 2px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabs button[aria-selected="true"] { color: #fff; background: var(--wood); }

/* ---- resources ---- */
.res { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.res svg { flex: none; }
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.slot { background: #fff6e2; padding: 6px 8px; box-shadow: inset 0 0 0 2px var(--paper-dark); display: flex; align-items: center; gap: 8px; }
.slot b { font-weight: normal; font-size: 24px; }

.bar { height: 14px; background: var(--paper-dark); box-shadow: inset 0 0 0 2px var(--wood-dark); position: relative; }
.bar > i { position: absolute; inset: 2px auto 2px 2px; background: var(--leaf); box-shadow: inset 0 -3px 0 var(--leaf-dark); max-width: calc(100% - 4px); }
.bar.full > i { background: var(--gold); box-shadow: inset 0 -3px 0 #c4963a; }

.big-number { font-family: var(--font-display); font-size: 34px; color: var(--wine); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 8px 14px; z-index: 20; max-width: 92vw;
  box-shadow: 0 0 0 var(--px) var(--wine);
}
.toast.error { background: var(--wine-dark); }

table.rank { width: 100%; border-collapse: collapse; }
table.rank td { padding: 5px 4px; border-bottom: 2px dashed var(--paper-dark); }
table.rank tr.me td { color: var(--wine); }
table.rank td.pos { width: 34px; font-family: var(--font-display); font-size: 16px; }
table.rank td.pts { text-align: right; font-family: var(--font-display); font-size: 16px; }

.seg { display: flex; gap: 6px; margin-bottom: 10px; }
.seg button { flex: 1; }
.seg .btn[aria-pressed="false"] { background: var(--paper-dark); color: var(--ink); box-shadow: inset 0 calc(var(--px) * -1) 0 #d6bf93, 0 0 0 var(--px) var(--wood); }

.prof-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prof-pick label { margin: 0; cursor: pointer; }
.prof-pick input { position: absolute; opacity: 0; width: 0; }
.prof-card { background: #fff6e2; padding: 10px; box-shadow: inset 0 0 0 var(--px) var(--paper-dark); color: var(--ink); height: 100%; }
.prof-pick input:checked + .prof-card { box-shadow: inset 0 0 0 var(--px) var(--flame); background: #fff; }
.prof-pick input:focus-visible + .prof-card { outline: var(--px) solid var(--wine); }

.hero { text-align: center; color: var(--paper); padding: 24px 0 8px; }
.hero svg { margin: 0 auto 10px; }
.hero h1 { font-size: 30px; }
.hero p { color: var(--paper-dark); }
.code { font-family: var(--font-display); letter-spacing: .15em; font-size: 22px; color: var(--wine); }

.avatar-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; max-height: 330px; overflow-y: auto; padding: 4px; }
.avatar-pick label { margin: 0; cursor: pointer; }
.avatar-pick input { position: absolute; opacity: 0; width: 0; }
.avatar-card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; background: #fff6e2; box-shadow: inset 0 0 0 2px var(--paper-dark); text-align: center; color: var(--ink); line-height: 1; }
.avatar-pick input:checked + .avatar-card { box-shadow: inset 0 0 0 var(--px) var(--flame); background: #fff; }
.avatar-pick input:focus-visible + .avatar-card { outline: var(--px) solid var(--wine); }
.topbar .lvl { margin-left: 0; }

/* ---- live farm scene ---- */
.farm-scene { overflow: auto; height: min(58vh, 440px); -webkit-overflow-scrolling: touch; scrollbar-width: thin; overscroll-behavior: contain; }
.farm-scene-inner { position: relative; }
.farm-scene-inner svg { width: 100%; height: auto; }
.farm-bubble {
  position: absolute; transform: translate(-50%, -100%);
  background: var(--paper); color: var(--ink); padding: 4px 8px 5px; white-space: nowrap;
  box-shadow: 0 0 0 2px var(--wood-dark), 0 3px 0 2px rgba(0,0,0,.25);
  display: flex; flex-direction: column; align-items: center; line-height: 1; pointer-events: none;
}
.farm-bubble b { font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--wine); }
.farm-bubble span { font-size: 16px; color: var(--ink-soft); }
.farm-bubble.below { transform: translate(-50%, 0); }
.farm-bubble.below::after { top: -6px; bottom: auto; border-top: 0; border-bottom: 4px solid var(--wood-dark); }
.farm-bubble::after { content: ""; position: absolute; bottom: -6px; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--wood-dark); border-bottom: 0; }

/* ---- farm stage: full-bleed map with floating chrome ---- */
.farm-stage {
  position: relative; flex: 1; min-height: 0;
  margin: 8px -12px 0;
  box-shadow: inset 0 0 0 var(--px) var(--wood-dark), inset 0 var(--px) 0 calc(var(--px) * 2) rgba(0,0,0,.25);
  background: var(--bg);
}
.farm-stage .farm-scene { height: 100%; }
.stage-top {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 3;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
.stage-top > * { pointer-events: auto; }
.chip {
  font-size: 15px; line-height: 1; color: var(--paper); background: rgba(59,38,48,.78);
  padding: 5px 8px 6px; box-shadow: 0 0 0 2px var(--wine-dark); max-width: 60%;
}

/* ---- bottom drawer ---- */
.drawer {
  position: absolute; left: 8px; right: 8px; bottom: 10px; z-index: 4;
  display: flex; flex-direction: column; max-height: calc(100% - 56px);
  background: var(--paper);
  box-shadow:
    0 0 0 var(--px) var(--wood),
    0 0 0 calc(var(--px) * 2) var(--wood-dark),
    0 calc(var(--px) * 3) 0 calc(var(--px) * 1) rgba(0,0,0,.25);
  border-radius: 2px;
}
.drawer-handle {
  font: inherit; color: var(--ink); background: none; border: 0; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; width: 100%;
  box-shadow: inset 0 calc(var(--px) * -1) 0 var(--paper-dark);
  touch-action: manipulation;
}
.drawer-handle .grow { display: flex; flex-direction: column; gap: 3px; }
.drawer-title { font-family: var(--font-display), monospace; font-size: 19px; color: var(--wine); line-height: 1.1; }
.drawer-sub { line-height: 1; }
.drawer-bar { height: 8px; margin-top: 2px; }
.drawer-bar > i { inset: 2px auto 2px 2px; }
.caret { width: 0; height: 0; border: 7px solid transparent; flex: none; }
.caret.up { border-bottom-color: var(--wood-dark); border-top: 0; }
.caret.down { border-top-color: var(--wood-dark); border-bottom: 0; }
.drawer-body { display: none; overflow-y: auto; padding: 10px 14px 14px; overscroll-behavior: contain; }
.drawer.open .drawer-body { display: block; }
.drawer.open .drawer-handle .drawer-bar { display: none; }

/* ---- Night prototype (/prototipo/noite, issue #14) ---- */
.night { --bg: #141a2e; }
.night .hero h1 { color: #e9d6ff; }
.night-classes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.night-class { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; font: inherit; color: var(--ink);
  background: var(--paper-dark); border: 0; box-shadow: 0 0 0 var(--px) var(--wood); cursor: pointer; }
.night-class[aria-pressed="true"] { background: #fff6e2; box-shadow: 0 0 0 var(--px) var(--wine), inset 0 -4px 0 #e9cfa0; }
.night-class b { color: var(--wine); font-family: var(--font-display); }
.night-enemies { margin: 0; padding-left: 18px; }
.night-hud { padding: 8px 10px; margin-bottom: 8px; }
.night-bars { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin-top: 6px; }
.night-arena { position: relative; box-shadow: 0 0 0 var(--px) #2a2140; background: #0b1030; line-height: 0; }
.night-arena svg { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.night-overlay { position: absolute; inset: 0; display: grid; place-items: center; color: #e9d6ff; font-family: var(--font-display);
  font-size: 24px; background: #0b103080; line-height: 1; }
.night-special { position: relative; overflow: hidden; margin-top: 10px; background: #3a2d5c; }
.night-special.ready { background: var(--flame); animation: night-pulse 0.8s ease-in-out infinite alternate; }
.night-energy { position: absolute; inset: 0 auto 0 0; background: #6a54a8; transition: width 0.2s; }
.night-special.ready .night-energy { display: none; }
.night-special-label { position: relative; }
.night-result { margin-top: 10px; text-align: center; }
.night-result .row { justify-content: center; }
.night-stars { font-size: 40px; letter-spacing: 6px; color: #00000030; line-height: 1; }
.night-stars .on { color: var(--gold); }
@keyframes night-pulse { from { filter: brightness(1); } to { filter: brightness(1.25); } }
@media (prefers-reduced-motion: reduce) { .night-special.ready { animation: none; } }
body:has(.night) { background: #141a2e; }
.night-special:disabled { filter: none; opacity: 1; color: #cfc3ea; }
.night-arena { max-width: 420px; margin: 0 auto; }
:root { --font-display: "Pixelify Sans"; --font-body: "VT323"; }
.demo-panel { position: fixed; right: 0; top: 46%; z-index: 50; display: flex; align-items: flex-start; font-family: var(--font-body), monospace; }
.demo-tab { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display), monospace; font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; border: 0; padding: 10px 6px; cursor: pointer; background: #1f4f6b; color: #e8f4fa; box-shadow: 0 0 0 2px #0f2d3e; }
.demo-body { order: -1; width: 244px; background: #eef6fa; color: #13303f; padding: 12px; display: flex; flex-direction: column; gap: 7px;
  box-shadow: 0 0 0 2px #0f2d3e, 0 6px 0 2px rgba(0,0,0,.25); font-size: 18px; line-height: 1.1; }
.demo-body b { font-family: var(--font-display), monospace; font-weight: 500; font-size: 15px; color: #1f4f6b; }
.demo-body p { margin: 0; }
.demo-lab { font-family: var(--font-display), monospace; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #4b6b7c; }
.demo-row { display: flex; flex-wrap: wrap; gap: 4px; }
.demo-body button { font-family: var(--font-display), monospace; font-size: 12px; border: 0; padding: 6px 8px; cursor: pointer; background: #d3e6ef; color: #13303f; box-shadow: inset 0 0 0 2px #8db3c6; }
.demo-body button[aria-pressed="true"] { background: #1f4f6b; color: #fff; box-shadow: none; }
.demo-body .demo-night-btn { background: #3a2d5c; color: #e9d6ff; box-shadow: none; }
.demo-body .demo-reset { background: transparent; color: #a33; box-shadow: inset 0 0 0 2px #e3b4b4; }
.demo-note { font-size: 15px; color: #4b6b7c; }
.demo-body button:focus-visible, .demo-tab:focus-visible { outline: 3px solid #f0566a; outline-offset: 1px; }
</style>
</head>

<div id="root"></div>
<script>
// Demo clock: replaces Date so the whole game (and its rules) can run faster or jump ahead.
(function () {
  var R = Date, K = "sitio-demo-clock", s = null;
  try { s = JSON.parse(localStorage.getItem(K)); } catch (e) {}
  var baseReal = R.now(), baseVirt = s ? s.virt + (R.now() - s.real) : R.now(), speed = 1;
  function vnow() { return Math.floor(baseVirt + (R.now() - baseReal) * speed); }
  function save() { try { localStorage.setItem(K, JSON.stringify({ virt: vnow(), real: R.now() })); } catch (e) {} }
  class V extends R { constructor(...a) { if (a.length) super(...a); else super(vnow()); } static now() { return vnow(); } }
  globalThis.Date = V;
  window.demoClock = {
    speed: function () { return speed; },
    setSpeed: function (x) { baseVirt = vnow(); baseReal = R.now(); speed = x; save(); },
    jump: function (ms) { baseVirt += ms; save(); },
    reset: function () { baseVirt = R.now(); baseReal = R.now(); speed = 1; try { localStorage.removeItem(K); } catch (e) {} },
  };
  setInterval(save, 2000);
})();
</script>
